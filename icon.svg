<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه گرادیان -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- لوگوی Elekta -->
  <g transform="translate(256, 246)">
    <!-- حلقه باز (C شکل با دهانه در سمت راست) -->
    <path d="M 88 -60 A 118 118 0 1 0 20 108"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="42"
          stroke-linecap="round"/>
    <!-- نقطه متوسط -->
    <circle cx="60" cy="-20" r="24" fill="#FFFFFF"/>
    <!-- نقطه کوچک -->
    <circle cx="18" cy="20" r="13" fill="#FFFFFF"/>
    <!-- نقطه ریز -->
    <circle cx="-15" cy="50" r="7" fill="#FFFFFF"/>
  </g>

  <!-- متن Elekta -->
  <text x="256" y="432"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="58"
        font-weight="600"
        letter-spacing="-1"
        fill="#FFFFFF">Elekta</text>
</svg>