<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#AF52DE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="220" fill="url(#glow)"/>

  <!-- Gantry arc -->
  <path d="M 96 256 A 160 160 0 0 1 416 256"
        fill="none" stroke="#FFFFFF" stroke-width="26"
        stroke-linecap="round" opacity="0.95"/>

  <!-- Head / MLC block -->
  <rect x="196" y="196" width="120" height="66" rx="14" fill="#FFFFFF"/>
  <rect x="216" y="212" width="80" height="8" rx="4" fill="#5E5CE6" opacity="0.7"/>
  <rect x="216" y="226" width="80" height="8" rx="4" fill="#5E5CE6" opacity="0.7"/>
  <rect x="216" y="240" width="80" height="8" rx="4" fill="#5E5CE6" opacity="0.7"/>

  <!-- Beam -->
  <rect x="252" y="262" width="8" height="76" fill="#FFFFFF" opacity="0.85"/>

  <!-- Target crosshair -->
  <circle cx="256" cy="352" r="26" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.95"/>
  <line x1="256" y1="314" x2="256" y2="330" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="374" x2="256" y2="390" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="218" y1="352" x2="234" y2="352" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="278" y1="352" x2="294" y2="352" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Patient couch -->
  <rect x="120" y="398" width="272" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
  <rect x="152" y="414" width="14" height="34" rx="4" fill="#FFFFFF" opacity="0.55"/>
  <rect x="346" y="414" width="14" height="34" rx="4" fill="#FFFFFF" opacity="0.55"/>
</svg>