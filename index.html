<title>سرویس الکتا</title>
<style>
:root{
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;
  --purple:#AF52DE;--teal:#5AC8FA;--indigo:#5856D6;--pink:#FF2D55;
  --yellow:#FFCC00;
  --bg:#F2F2F7;--card:#FFF;
  --label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);
  --pad:16px;--nav-h:44px;--tab-h:49px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000;--card:#1C1C1E;
    --label:#FFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.36);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--label);
  font-family:-apple-system,"SF Pro Text","Vazirmatn",Tahoma,sans-serif;
  font-size:17px;line-height:1.4;letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--tab-h) + var(--safe-b) + 24px)}
.nav{position:sticky;top:0;z-index:20;padding:6px var(--pad) 10px;
  background:rgba(242,242,247,.82);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px)}
@media (prefers-color-scheme: dark){.nav{background:rgba(0,0,0,.75)}}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;
  background:var(--sep);opacity:0;transition:opacity .18s}
.nav.scrolled::after{opacity:1}
.nav-top{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h)}
.nav-title-sm{font-size:17px;font-weight:600;opacity:0;transform:translateY(4px);transition:all .2s}
.nav.scrolled .nav-title-sm{opacity:1;transform:none}
.nav-large{font-size:34px;font-weight:700;letter-spacing:-.02em;transition:all .2s;transform-origin:right}
.nav.scrolled .nav-large{font-size:0;opacity:0;height:0;margin:0}
.search{padding:0 var(--pad) 8px}
.search-inner{display:flex;align-items:center;gap:8px;
  background:var(--fill);border-radius:10px;padding:8px 12px;height:36px}
.search-inner svg{width:16px;height:16px;color:var(--label2);flex-shrink:0}
.search-inner input{flex:1;background:none;border:0;outline:none;font-size:17px}
.section{padding:0 var(--pad);margin-top:22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.section-t{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:.02em}
.section-a{font-size:15px;color:var(--blue);font-weight:500}
.card{background:var(--card);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:52px;
  position:relative;width:100%}
.row+.row::before{content:"";position:absolute;top:0;right:16px;left:0;
  height:.5px;background:var(--sep)}
.row-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  flex-shrink:0;color:#fff}
.row-icon svg{width:17px;height:17px}
.row-body{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:500}
.row-sub{font-size:13px;color:var(--label2);margin-top:2px}
.row-chev{color:var(--label3);flex-shrink:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--pad) 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:100px;background:var(--fill);
  font-size:14px;font-weight:500;transition:all .15s;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff}
.manual{background:var(--card);border-radius:16px;padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;
  transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.manual:active{transform:scale(.985)}
.manual-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;color:#fff}
.manual-ic svg{width:22px;height:22px}
.manual-body{flex:1;min-width:0}
.manual-title{font-size:16px;font-weight:600;margin-bottom:3px}
.manual-sub{font-size:13px;color:var(--label2);line-height:1.35;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.manual-meta{display:flex;gap:10px;margin-top:8px;font-size:11px;
  color:var(--label2);align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:100px;font-size:11px;font-weight:600;
  background:var(--fill);color:var(--label2)}
.manual-fav{color:var(--label3);flex-shrink:0;padding:4px}
.manual-fav.on{color:var(--yellow)}
.manual-fav svg{width:18px;height:18px}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:var(--card);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff}
.cat-ic svg{width:22px;height:22px}
.cat-n{font-size:15px;font-weight:600}
.cat-c{font-size:12px;color:var(--label2)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:var(--safe-b);
  background:rgba(242,242,247,.78);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--sep)}
@media (prefers-color-scheme: dark){.tabbar{background:rgba(0,0,0,.72)}}
.tabbar-inner{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--label3);font-size:10px;font-weight:500;transition:color .15s}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--blue)}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .28s}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:22px 22px 0 0;padding-bottom:var(--safe-b);
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.15)}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:36px;height:5px;border-radius:100px;background:var(--label3);margin:8px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px 12px;gap:8px}
.sheet-title{font-size:17px;font-weight:600;flex:1;text-align:center}
.sheet-act{color:var(--blue);font-size:17px;padding:4px 8px}
.sheet-body{overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.detail-hero{background:linear-gradient(145deg,var(--blue),var(--indigo));
  border-radius:22px;padding:22px 20px;color:#fff;margin-bottom:18px}
.detail-cat{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.05em}
.detail-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px;line-height:1.25}
.detail-sum{font-size:14px;opacity:.92;line-height:1.5}
.detail-meta{display:flex;gap:12px;margin-top:16px;padding-top:16px;
  border-top:1px solid rgba(255,255,255,.2);flex-wrap:wrap}
.detail-meta-item{display:flex;align-items:center;gap:6px;font-size:12px}
.detail-meta-item svg{width:14px;height:14px}
.step{display:flex;gap:14px;padding:14px 0;position:relative}
.step+.step::before{content:"";position:absolute;top:0;right:35px;left:0;
  height:.5px;background:var(--sep)}
.step-n{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:var(--blue);
  color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.step-body{flex:1}
.step-t{font-size:15px;font-weight:500;line-height:1.5}
.step-note{font-size:13px;color:var(--label2);margin-top:6px;padding:8px 10px;
  background:var(--fill);border-radius:8px;border-right:3px solid var(--blue)}
.step.warn .step-n{background:var(--orange)}
.step.warn .step-note{border-right-color:var(--orange)}
.step.danger .step-n{background:var(--red)}
.step.danger .step-note{border-right-color:var(--red)}
.alert-box{display:flex;gap:12px;padding:14px;border-radius:12px;margin-bottom:14px;
  background:rgba(255,149,0,.12);border:.5px solid rgba(255,149,0,.3)}
.alert-box svg{width:22px;height:22px;flex-shrink:0;color:var(--orange)}
.alert-box .txt{font-size:14px;line-height:1.5}
.alert-box .t{font-weight:600;margin-bottom:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:5px 10px;background:var(--fill);border-radius:100px;
  font-size:12px;color:var(--label2)}
.ecode{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.ecode+.ecode::before{content:"";position:absolute;top:0;right:16px;left:0;
  height:.5px;background:var(--sep)}
.ecode-code{font-family:ui-monospace,monospace;font-size:15px;font-weight:700;
  padding:5px 10px;border-radius:8px;min-width:70px;text-align:center;
  background:var(--fill);direction:ltr}
.ecode-code.red{background:rgba(255,59,48,.15);color:var(--red)}
.ecode-code.orange{background:rgba(255,149,0,.15);color:var(--orange)}
.ecode-code.blue{background:rgba(0,122,255,.15);color:var(--blue)}
.ecode-body{flex:1;min-width:0}
.ecode-t{font-size:14px;font-weight:500}
.ecode-s{font-size:12px;color:var(--label2);margin-top:2px}
.empty{text-align:center;padding:60px 20px;color:var(--label2)}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:12px}
.empty-t{font-size:16px;font-weight:600;color:var(--label);margin-bottom:4px}
.page{display:none}
.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:12px;padding:14px 8px;text-align:center}
.stat-v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat-l{font-size:11px;color:var(--label2);margin-top:2px}
.toast{position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 20px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--label);color:var(--bg);padding:10px 20px;border-radius:100px;
  font-size:14px;font-weight:500;z-index:100;opacity:0;transition:all .3s;
  pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="app">
  <main id="main">
    <!-- HOME -->
    <section id="page-home" class="page on">
      <header class="nav" data-nav>

      <div class="search">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>

    <!-- MORE -->
    <section id="page-more" class="page">
      <header class="nav" data-nav>
        <div class="nav-top"><div class="nav-title-sm">بیشتر</div></div>
        <div class="nav-large">بیشتر</div>
      </header>
      <div class="section" style="margin-top:6px">
        <div class="section-h"><div class="section-t">درباره</div></div>
        <div class="card">
          <div class="row"><div class="row-body"><div class="row-title">نسخه</div></div><div style="color:var(--label2)">۱.۰</div></div>
          <div class="row"><div class="row-body"><div class="row-title">تعداد منوال</div></div><div style="color:var(--label2)" id="abM">—</div></div>
          <div class="row"><div class="row-body"><div class="row-title">وضعیت آفلاین</div></div><div style="color:var(--green);font-weight:600" id="onlineStatus">فعال ✓</div></div>

  </main>

  <nav class="tabbar"><div class="tabbar-inner" id="tabbar"></div></nav>

    <button class="sheet-act" onclick="closeSheet()">بستن</button>
    <div class="sheet-title" id="sheetTitle">منوال</div>

<script>
/* ============ DATA ============ */
const CATS = [
  {id:"daily",  name:"QA روزانه",     color:"var(--green)",  icon:"check"},
  {id:"weekly", name:"QA هفتگی",      color:"var(--teal)",   icon:"cal"},
  {id:"monthly",name:"QA ماهانه",     color:"var(--blue)",   icon:"clock"},

  {id:"imaging",name:"تصویربرداری",   color:"var(--indigo)", icon:"cam"},
  {id:"replace",name:"تعویض قطعات",   color:"var(--pink)",   icon:"wrench"},
  {id:"trouble",name:"عیب‌یابی",      color:"var(--red)",    icon:"warn"}
];

const ICONS = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',

  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1 5.4 5.4l-9.7 9.7-5.4-5.4 9.7-9.7z"/></svg>',

const fa = n => String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const $ = s => document.querySelector(s);
let libFilter = "all", libQ = "", codeFilter = "all", codeQ = "";
let favs = new Set(JSON.parse(localStorage.getItem("favs") || "[]"));
let curSheetManual = null;

/* ============ RENDER ============ */
function renderStats(){
  $("#stM").textContent = fa(MANUALS.length);
  $("#stE").textContent = fa(ERRORS.length);
  $("#stF").textContent = fa(favs.size);
  $("#abM").textContent = fa(MANUALS.length) + " مورد";
}
function renderCats(){
  $("#catGrid").innerHTML = CATS.map(c => {
    const cnt = MANUALS.filter(m => m.cat === c.id).length;
    return `<button class="cat" onclick="goCat('${c.id}')">
      <div class="cat-ic" style="background:${c.color}">${ICONS[c.icon]}</div>
      <div><div class="cat-n">${c.name}</div><div class="cat-c">${fa(cnt)} منوال</div></div>
    </button>`;
  }).join("");
}
function renderHomePop(){
  const ids = ["m1","m5","m7","m11"];
  $("#homePop").innerHTML = ids.map(id => MANUALS.find(m => m.id === id)).filter(Boolean)
    .map(m => manualCard(m, true)).join("");
}
function manualCard(m, compact=false){
  const cat = CATS.find(c => c.id === m.cat);
  const isFav = favs.has(m.id);
  return `<div class="manual" onclick="openManual('${m.id}')">
    <div class="manual-ic" style="background:${cat.color}">${ICONS[cat.icon]}</div>
    <div class="manual-body">
      <div class="manual-title">${m.title}</div>
      ${!compact ? `<div class="manual-sub">${m.summary}</div>` : ""}
      <div class="manual-meta">
        <span class="badge">${m.code}</span>
        <span>${m.duration}</span>
        <span>${m.level}</span>
      </div>
    </div>
    <button class="manual-fav ${isFav?'on':''}" onclick="event.stopPropagation();toggleFav('${m.id}')">
      ${isFav ? ICONS.starFill : ICONS.star}
    </button>
  </div>`;
}
function renderLibChips(){
  const all = [{id:"all",name:"همه"},...CATS];
  $("#libChips").innerHTML = all.map(c =>
    `<button class="chip ${libFilter===c.id?'on':''}" onclick="libFilter='${c.id}';renderLibChips();renderLib()">${c.name}</button>`
  ).join("");
}
function renderLib(){
  let list = MANUALS.filter(m => libFilter === "all" || m.cat === libFilter);
  if(libQ.trim()){
    const q = libQ.toLowerCase();
    list = list.filter(m => (m.title+m.summary+m.code+m.machines.join(" ")).toLowerCase().includes(q));
  }
  const el = $("#libList");
  if(!list.length){ el.innerHTML = emptyState("منوالی یافت نشد","فیلتر را تغییر دهید"); return; }
  el.innerHTML = list.map(m => manualCard(m)).join("");
}
function renderCodeChips(){
  const sevs = [{id:"all",n:"همه"},{id:"red",n:"بحرانی"},{id:"orange",n:"هشدار"},{id:"blue",n:"اطلاع"}];
  $("#codeChips").innerHTML = sevs.map(s =>
    `<button class="chip ${codeFilter===s.id?'on':''}" onclick="codeFilter='${s.id}';renderCodeChips();renderCodes()">${s.n}</button>`
  ).join("");
}
function renderCodes(){
  let list = ERRORS.filter(c => codeFilter === "all" || c.sev === codeFilter);
  if(codeQ.trim()){
    const q = codeQ.toLowerCase();
    list = list.filter(c => (c.code+c.title+c.act+c.machine).toLowerCase().includes(q));
  }
  const el = $("#codeList");
  if(!list.length){ el.innerHTML = `<div style="padding:40px;text-align:center;color:var(--label2)">کدی یافت نشد</div>`; return; }
  el.innerHTML = list.map(c => `<div class="ecode">
    <div class="ecode-code ${c.sev}">${c.code}</div>
    <div class="ecode-body">
      <div class="ecode-t">${c.title}</div>
      <div class="ecode-s">${c.machine}</div>
      <div class="ecode-s" style="color:var(--blue);margin-top:4px">اقدام: ${c.act}</div>
    </div>
  </div>`).join("");
}
function renderFavs(){
  const list = MANUALS.filter(m => favs.has(m.id));
  const el = $("#favList");
  if(!list.length){ el.innerHTML = emptyState("هنوز چیزی ذخیره نکردی","روی ستاره بزن تا اینجا بیاد"); return; }
  el.innerHTML = list.map(m => manualCard(m)).join("");
}
function renderMachineList(){
  $("#machineList").innerHTML = MACHINES.map((m,i) => {
    const cnt = MANUALS.filter(x => x.machines.includes(m)).length;
    const colors = ["var(--blue)","var(--green)","var(--orange)","var(--purple)","var(--pink)","var(--teal)","var(--indigo)"];
    return `<button class="row" onclick="filterMachine('${m}')">
      <div class="row-icon" style="background:${colors[i%7]}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="6" rx="2"/><path d="M8 9v4a4 4 0 0 0 8 0V9"/><circle cx="12" cy="17" r="3"/></svg>
      </div>
      <div class="row-body"><div class="row-title">${m}</div><div class="row-sub">${fa(cnt)} منوال</div></div>
      <div class="row-chev">${ICONS.chev}</div>
    </button>`;
  }).join("");
}
function emptyState(t, s){
  return `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
    <div class="empty-t">${t}</div>
    <div>${s}</div>
  </div>`;
}

/* ============ DETAIL ============ */
function openManual(id){
  const m = MANUALS.find(x => x.id === id);
  if(!m) return;
  curSheetManual = m;
  const cat = CATS.find(c => c.id === m.cat);
  const isFav = favs.has(m.id);
  const fb = $("#sheetFav");
  fb.innerHTML = isFav ? ICONS.starFill : ICONS.star;
  fb.style.color = isFav ? "var(--yellow)" : "var(--blue)";
  fb.style.opacity = 1;
  fb.onclick = () => { toggleFav(m.id); openManual(m.id); };
  $("#sheetTitle").textContent = m.code;
  $("#sheetBody").innerHTML = `
    <div class="detail-hero" style="background:linear-gradient(145deg,${cat.color},var(--indigo))">
      <div class="detail-cat">${cat.name}</div>
      <div class="detail-title">${m.title}</div>
      <div class="detail-sum">${m.summary}</div>
      <div class="detail-meta">
        <div class="detail-meta-item">${ICONS.clock}<span>${m.duration}</span></div>
        <div class="detail-meta-item">${ICONS.target}<span>${m.level}</span></div>
      </div>
    </div>
    ${m.warn ? `<div class="alert-box">${ICONS.warn}<div class="txt"><div class="t">هشدار ایمنی</div>${m.warn}</div></div>` : ""}
    <div class="section-h" style="padding-right:0"><div class="section-t">دستگاه‌های مرتبط</div></div>
    <div class="tags" style="margin-bottom:16px">${m.machines.map(x => `<span class="tag">${x}</span>`).join("")}</div>
    <div class="section-h" style="padding-right:0"><div class="section-t">ابزار مورد نیاز</div></div>
    <div class="tags" style="margin-bottom:20px">${m.tools.map(x => `<span class="tag">${x}</span>`).join("")}</div>
    <div class="section-h" style="padding-right:0"><div class="section-t">مراحل (${fa(m.steps.length)})</div></div>
    <div style="background:var(--card);border-radius:14px;padding:4px 16px;margin-bottom:16px">
      ${m.steps.map((s,i) => `<div class="step ${s.level||''}">
        <div class="step-n">${fa(i+1)}</div>
        <div class="step-body"><div class="step-t">${s.t}</div>${s.note?`<div class="step-note">${s.note}</div>`:""}</div>
      </div>`).join("")}
    </div>
  `;
  $("#backdrop").classList.add("show");
  $("#sheet").classList.add("show");
}
function closeSheet(){
  $("#backdrop").classList.remove("show");
  $("#sheet").classList.remove("show");
}
function toggleFav(id){
  if(favs.has(id)){ favs.delete(id); toast("حذف شد"); }
  else { favs.add(id); toast("ذخیره شد ★"); }
  localStorage.setItem("favs", JSON.stringify([...favs]));
  renderStats(); renderHomePop(); renderLib(); renderFavs();
  if(curSheetManual){
    const fb = $("#sheetFav");
    const isFav = favs.has(curSheetManual.id);
    fb.innerHTML = isFav ? ICONS.starFill : ICONS.star;
    fb.style.color = isFav ? "var(--yellow)" : "var(--blue)";
  }
}
function filterMachine(m){
  libFilter = "all"; libQ = m;
  renderLibChips(); renderLib();
  go("lib");
}
function goCat(id){
  libFilter = id; renderLibChips(); renderLib(); go("lib");
}

/* ============ TABS ============ */
const TABS = [
  {id:"home",label:"خانه",icon:ICONS.home},
  {id:"lib",label:"کتابخانه",icon:ICONS.book},
  {id:"codes",label:"کد خطا",icon:ICONS.warn},
  {id:"fav",label:"ذخیره",icon:ICONS.star},
  {id:"more",label:"بیشتر",icon:ICONS.more}
];
function renderTabbar(){
  const cur = document.querySelector(".page.on").id.replace("page-","");
  $("#tabbar").innerHTML = TABS.map(t =>
    `<button class="tab ${t.id===cur?'active':''}" onclick="go('${t.id}')">${t.icon}<span>${t.label}</span></button>`
  ).join("");
}
function go(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("on"));
  document.getElementById("page-"+id).classList.add("on");
  document.getElementById("main").scrollTop = 0;
  document.querySelectorAll("[data-nav]").forEach(n => n.classList.remove("scrolled"));
  renderTabbar();
  if(id === "fav") renderFavs();
  if(id === "lib") renderLib();
  if(id === "codes") renderCodes();
}

/* ============ MISC ============ */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function updateOnline(){
  const el = $("#onlineStatus");
  if(!el) return;
  if(navigator.onLine){ el.textContent = "فعال ✓"; el.style.color = "var(--green)"; }
  else { el.textContent = "آفلاین — کش"; el.style.color = "var(--blue)"; }
}
window.addEventListener("online", updateOnline);
window.addEventListener("offline", updateOnline);
document.getElementById("main").addEventListener("scroll", e => {
  const top = e.target.scrollTop;
  const nav = document.querySelector(".page.on [data-nav]");
  if(!nav) return;
  nav.classList.toggle("scrolled", top > 24);
});

/* Service Worker */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* INIT */
renderTabbar();
renderStats();
renderCats();
renderHomePop();
renderLibChips();
renderLib();
renderCodeChips();
renderCodes();
renderFavs();
renderMachineList();
updateOnline();
</script>
</body>
</html>
